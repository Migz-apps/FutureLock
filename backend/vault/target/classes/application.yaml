server:
  port: 8081
  compression:
    enabled: true

spring:
  application:
    name: vault

  threads:
    virtual:
      enabled: true

  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://localhost:5432/futurelock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    pool:
      initial-size: 5
      max-size: 50
      max-idle-time: 30m

  main:
    lazy-initialization: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000}

  mail:
    enabled: ${MAIL_ENABLED:true}

  jwt:
    secret: ${JWT_SECRET:FutureLockDevelopmentSecretKeyChangeThisBeforeProduction1234567890}
    access-token-minutes: 15
    refresh-token-days: 7