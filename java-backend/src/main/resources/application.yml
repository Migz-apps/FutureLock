server:
  port: 8080

spring:
  application:
    name: vault-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/futurelock
    username: dbuser
    password: dbpassword
    pool:
        # Settings for 5M+ connection surges
        initial-size: 100
        max-size: 5000
        max-idle-time: 30m
        validation-query: SELECT 1
        
resilience4j.circuitbreaker:
  instances:
    marketplaceService:
      registerHealthIndicator: true
      slidingWindowSize: 1000
      minimumNumberOfCalls: 500
      permittedNumberOfCallsInHalfOpenState: 100
      waitDurationInOpenState: 5s
      failureRateThreshold: 50
      
resilience4j.ratelimiter:
  instances:
    apiRateLimiter:
      limitForPeriod: 5000000
      limitRefreshPeriod: 1s
      timeoutDuration: 100ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: ALWAYS
      
# Environment level JVM Memory Management (G1GC or ZGC Tuning)
# Add these to JAVA_OPTS at runtime:
# ZGC (Java 21 defaults, excellent for massive scale with sub-millisecond pauses):
# -XX:+UseZGC -XX:+ZGenerational -Xmx32G -Xms32G
# G1GC Alternative:
# -XX:+UseG1GC -XX:MaxGCPauseMillis=50 -Xmx32G -Xms32G -XX:G1HeapRegionSize=32M
